<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Crear acceso · Agenda del Grupo</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/acceso.css"></head>
<body><form class="box" id="f"><div class="logo">AG</div><div><h1 id="t">Crea tu acceso</h1><p id="s">Cargando tu invitación…</p></div>
<div id="campos" style="display:none;flex-direction:column;gap:14px">
<div><label for="nombre">Tu nombre</label><input id="nombre" required></div>
<div><label for="correo">Tu correo (con este entras)</label><input id="correo" type="email" required autocomplete="username"></div>
<div><label for="clave">Contraseña (mínimo 8 caracteres)</label><input id="clave" type="password" minlength="8" required autocomplete="new-password"></div>
<button class="btn" id="btn">Guardar y entrar</button></div>
<div class="msg" id="msg"></div><p style="text-align:center;font-size:14px"><a href="/entrar">Ya tengo acceso, quiero entrar</a></p></form>
<script>
const token=location.pathname.split('/').pop();const msg=document.getElementById('msg'),btn=document.getElementById('btn'),campos=document.getElementById('campos');
(async()=>{try{const r=await fetch('/api/invitacion/'+token);const j=await r.json();if(!r.ok)throw new Error(j.error);nombre.value=j.nombre||'';correo.value=j.correo||'';document.getElementById('s').textContent=j.tieneClave?'Crea una contraseña nueva para '+j.nombre+'.':'Hola '+j.nombre+', revisa tus datos y elige una contraseña.';campos.style.display='flex';}
 catch(err){msg.textContent=err.message;msg.className='msg bad';}})();
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Guardando…';msg.className='msg';
 try{const r=await fetch('/api/invitacion/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nombre:nombre.value,correo:correo.value,clave:clave.value})});const j=await r.json();if(!r.ok)throw new Error(j.error);location.href='/';}
 catch(err){msg.textContent=err.message||'No se pudo guardar.';msg.className='msg bad';btn.disabled=false;btn.textContent='Guardar y entrar';}});
</script></body></html>
