<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · Agenda del Grupo</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/iconos/icono-192.png"><link rel="apple-touch-icon" href="/iconos/icono-192.png">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/acceso.css"></head>
<body><form class="box" id="f"><div class="logo">AG</div><div><h1>Agenda del Grupo</h1><p>Entra con tu correo y contraseña.</p></div>
<div><label for="correo">Correo</label><input id="correo" type="email" autocomplete="username" required placeholder="tu@correo.com"></div>
<div><label for="clave">Contraseña</label><input id="clave" type="password" autocomplete="current-password" required></div>
<div class="msg" id="msg"></div><button class="btn" id="btn">Entrar</button>
<p style="text-align:center;font-size:14px"><a href="#" id="olvide">Olvidé mi contraseña</a></p></form>
<script>
const f=document.getElementById('f'),msg=document.getElementById('msg'),btn=document.getElementById('btn');
f.addEventListener('submit',async e=>{e.preventDefault();btn.disabled=true;btn.textContent='Entrando…';msg.className='msg';
 try{const r=await fetch('/api/entrar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:correo.value,clave:clave.value})});const j=await r.json();if(!r.ok)throw new Error(j.error);location.href='/';}
 catch(err){msg.textContent=err.message||'No se pudo entrar. Revisa tu conexión.';msg.className='msg bad';btn.disabled=false;btn.textContent='Entrar';}});
document.getElementById('olvide').addEventListener('click',async e=>{e.preventDefault();if(!correo.value){msg.textContent='Escribe tu correo primero y vuelve a tocar "Olvidé mi contraseña".';msg.className='msg bad';correo.focus();return;}
 const r=await fetch('/api/recuperar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({correo:correo.value})});const j=await r.json();msg.textContent=j.mensaje||'Listo.';msg.className='msg ok';});
</script></body></html>
