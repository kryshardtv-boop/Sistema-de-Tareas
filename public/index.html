<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Agenda del Grupo</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/iconos/icono-192.png">
<link rel="apple-touch-icon" href="/iconos/icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: white app shell, one primary color for actions, soft company colors, side panel on desktop and bottom sheet on phone. */
  --bg:#f5f6f9; --surface:#ffffff; --surface-2:#eef0f5; --text:#1b2030; --muted:#5f6880; --line:#e3e6ee;
  --primary:#4f46e5; --primary-ink:#ffffff; --primary-soft:#e9e8fb;
  --ok:#1d7f55; --ok-soft:#dcf3e7; --warn:#9a5a00; --warn-soft:#fff0cc; --bad:#c03a30; --bad-soft:#fde1de;
  --font:'Nunito',system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 2px 6px rgba(27,32,48,.06), 0 10px 24px rgba(27,32,48,.06);
  --H:64px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121520; --surface:#1b1f2c; --surface-2:#242938; --text:#eceef5; --muted:#a3abc0; --line:#2f3547;
    --primary:#8b86ff; --primary-ink:#11122b; --primary-soft:#2a2a4f;
    --ok:#5fd39a; --ok-soft:#173b2b; --warn:#f3bb5e; --warn-soft:#3d2e10; --bad:#f28b83; --bad-soft:#45201e;
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121520; --surface:#1b1f2c; --surface-2:#242938; --text:#eceef5; --muted:#a3abc0; --line:#2f3547;
  --primary:#8b86ff; --primary-ink:#11122b; --primary-soft:#2a2a4f;
  --ok:#5fd39a; --ok-soft:#173b2b; --warn:#f3bb5e; --warn-soft:#3d2e10; --bad:#f28b83; --bad-soft:#45201e;
  --shadow:0 2px 6px rgba(0,0,0,.4), 0 10px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance;font-weight:800}
h1{font-size:24px} h2{font-size:19px} h3{font-size:16px}
p{margin:0} a{color:var(--primary)} button{font:inherit}
.muted{color:var(--muted)} .small{font-size:14px} .num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
@media (prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important}}

.demo-strip{background:var(--warn-soft);color:var(--warn);font-size:14px;font-weight:700;text-align:center;padding:7px 16px}
.offline{display:none;background:var(--bad-soft);color:var(--bad);font-size:14px;font-weight:700;text-align:center;padding:8px 16px}
.offline.show{display:block}

/* Shell */
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .logo{width:38px;height:38px;border-radius:12px;background:var(--primary);color:var(--primary-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:600}
.nav-btn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:transparent;color:var(--text);padding:12px 12px;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;min-height:48px}
.nav-btn:hover{background:var(--surface-2)}
.nav-btn.active{background:var(--primary-soft);color:var(--primary)}
.nav-btn .ico{width:24px;text-align:center;font-size:18px}
.nav-sep{height:1px;background:var(--line);margin:10px 6px}
.count{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:800;padding:1px 8px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topbar .title{flex:1;min-width:0}
.topbar .title h1{font-size:20px}
.userchip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:4px 12px 4px 4px;min-height:44px;font-weight:800;background:var(--surface)}
.userchip .av{margin:0}
.bell{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;height:44px;padding:0 14px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:8px}
.bell .dot{background:var(--bad);color:#fff;border-radius:999px;font-size:12px;font-weight:800;min-width:20px;height:20px;display:grid;place-items:center;padding:0 6px}
.content{padding:24px;max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:20px;padding-bottom:48px}
.tabbar{display:none}
.fab{display:none}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 14px}
  .userchip .lbl-user{display:none}
  .userchip{padding:4px}
  .bell .lbl{display:none}
  .bell{padding:0 12px}
  .content{padding:14px;gap:16px;padding-bottom:120px}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding:6px 6px calc(8px + env(safe-area-inset-bottom))}
  .tab{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:12px;font-weight:800;border-radius:12px;cursor:pointer;min-height:52px}
  .tab .ico{font-size:22px}
  .tab.active{color:var(--primary)}
  .fab{display:inline-flex;position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:7;box-shadow:var(--shadow)}
  .topbar .title h1{font-size:18px}
  #topCrear{display:none}
}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.stripe{border-left:6px solid var(--c)}
.sec{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec .sub{color:var(--muted);font-size:14px;font-weight:600}
.list{display:flex;flex-direction:column;gap:10px}
.empty{padding:22px 16px;border-radius:14px;background:var(--surface-2);color:var(--muted);text-align:center;font-weight:700;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty .big{font-size:28px}

/* Activity card (lists) */
.acard{display:flex;gap:14px;align-items:stretch;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--text);border-left:6px solid var(--c);transition:transform .15s, box-shadow .15s}
.acard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.acard.done{opacity:.65}
.acard .time{min-width:78px;font-weight:800;font-size:15px;line-height:1.25;display:flex;flex-direction:column;justify-content:center}
.acard .time small{color:var(--muted);font-weight:700;font-size:13px}
.acard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.acard .name{font-weight:800;font-size:16px}
.acard.off .name{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;color:var(--muted);font-size:14px;font-weight:600;align-items:center}
.tcard{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);border-left:6px solid var(--c)}
.tcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.tcard .name{font-weight:800}
.tcard.done .name{text-decoration:line-through;color:var(--muted)}
.checkbtn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);color:var(--ok);cursor:pointer;font-size:22px;display:grid;place-items:center;flex:none;transition:transform .15s, background .15s}
.checkbtn:hover{border-color:var(--ok)}
.checkbtn.on{background:var(--ok);border-color:var(--ok);color:#fff;transform:scale(1.05)}
.checkbtn[disabled]{opacity:.5;cursor:default}

/* Chips, labels, avatars */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;white-space:nowrap;background:var(--surface-2);color:var(--text)}
.emp{--c:#888;background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text))}
.lbl{display:inline-flex;align-items:center;gap:6px;border-radius:8px;padding:3px 9px;font-size:13px;font-weight:800;white-space:nowrap}
.l-pend{background:var(--warn-soft);color:var(--warn)} .l-ok{background:var(--ok-soft);color:var(--ok)} .l-bad{background:var(--bad-soft);color:var(--bad)} .l-gray{background:var(--surface-2);color:var(--muted)} .l-info{background:var(--primary-soft);color:var(--primary)}
.avatars{display:flex;align-items:center}
.av{width:30px;height:30px;border-radius:50%;background:var(--pc,#888);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;border:2px solid var(--surface);margin-left:-7px;flex:none}
.av:first-child{margin-left:0}
.av.lg{width:40px;height:40px;font-size:14px;margin:0} .av.xl{width:52px;height:52px;font-size:17px;margin:0}
.av img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.ppl{display:flex;flex-wrap:wrap;gap:8px}
.pbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:5px 12px 5px 5px;font-weight:800;cursor:pointer;min-height:44px}
.pbtn.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.pbtn .av{margin:0}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:0 18px;min-height:50px;font-weight:800;font-size:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .1s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.sm{min-height:42px;padding:0 14px;font-size:15px;border-radius:12px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.btn-row.end{justify-content:flex-end}
.btn-row.stack .btn{flex:1 1 180px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:800;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:16px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:12px;padding:12px 12px;width:100%;min-height:48px}
.field textarea{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font-weight:800;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.opt.on{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.opt.emp.on{border-color:var(--c)}
.fsec{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:14px;background:var(--surface-2)}
.fsec h3{font-size:16px}
details.more summary{cursor:pointer;font-weight:800;color:var(--primary);padding:8px 0;list-style:none}
details.more summary::before{content:"+ ";}
details.more[open] summary::before{content:"– ";}
.note{border-radius:12px;padding:12px 14px;font-size:14px;font-weight:600;background:var(--surface-2);color:var(--muted)}
.note.warn{background:var(--warn-soft);color:var(--warn)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.bad{background:var(--bad-soft);color:var(--bad)} .note.info{background:var(--primary-soft);color:var(--primary)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:0}
.switch .t{font-weight:800} .switch .d{font-size:14px;color:var(--muted);font-weight:600}
.toggle{position:relative;width:52px;height:30px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;flex:none;padding:0}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .15s}
.toggle[aria-checked="true"]{background:var(--ok);border-color:var(--ok)} .toggle[aria-checked="true"]::after{left:24px}
.toggle[disabled]{opacity:.5;cursor:not-allowed}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.check{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-weight:700;min-height:48px}
.check input{width:20px;height:20px;margin:0}

/* Day strip and calendar controls */
.daystrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dpill{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:14px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-height:58px;font-weight:800}
.dpill small{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase}
.dpill .n{font-size:18px}
.dpill.sel{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)} .dpill.sel small{color:var(--primary-ink);opacity:.85}
.dpill.today:not(.sel) .n{color:var(--primary)}
.dpill .dots{display:flex;gap:3px;height:6px}
.dpill .dots i{width:6px;height:6px;border-radius:50%;background:var(--c)}
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calbar .range{font-weight:800;font-size:17px;flex:1;min-width:160px}
.seg{display:flex;background:var(--surface-2);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;color:var(--muted);padding:8px 14px;border-radius:9px;font-weight:800;cursor:pointer;min-height:40px}
.seg button.active{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}

/* Time grid */
.cal{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.cal-scroll{overflow:auto;max-height:calc(100vh - 290px);min-height:420px}
.cal-grid{display:grid;grid-template-columns:76px repeat(var(--n),minmax(var(--cw),1fr));min-width:100%}
.cal-grid .corner,.cal-grid .chead{position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;min-height:62px}
.cal-grid .corner{left:0;z-index:4}
.chead{display:flex;align-items:center;gap:10px;font-weight:800}
.chead .d{display:flex;flex-direction:column;line-height:1.1}
.chead .d small{color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}
.chead .d .n{font-size:20px}
.chead.today .d .n{color:var(--primary)}
.chead .sub{font-size:12px;color:var(--muted);font-weight:700}
.hours{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line)}
.hours div{height:var(--H);font-size:12px;color:var(--muted);font-weight:800;text-align:right;padding:3px 8px 0 0;white-space:nowrap;line-height:1}
.col{position:relative;height:calc(var(--H) * var(--rows));border-right:1px solid var(--line);background-image:linear-gradient(var(--line) 1px, transparent 1px);background-size:100% var(--H);cursor:pointer}
.col.today{background-color:color-mix(in srgb,var(--primary) 4%,transparent)}
.col.drop{background-color:var(--primary-soft)}
.blk{position:absolute;left:3px;right:3px;border-radius:10px;padding:6px 8px;overflow:hidden;background:color-mix(in srgb,var(--c) 14%,var(--surface));border-left:4px solid var(--c);color:var(--text);font-size:13px;line-height:1.25;display:flex;flex-direction:column;gap:3px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:box-shadow .15s}
.blk:hover{box-shadow:var(--shadow);z-index:2}
.blk .t{font-weight:800;font-size:13px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.blk .h{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
.blk .e{font-size:11px;font-weight:800;color:color-mix(in srgb,var(--c) 70%,var(--text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .s{font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.blk .av{width:22px;height:22px;font-size:10px;margin-left:-5px}
.blk.off{opacity:.55;border-left-style:dashed} .blk.off .t{text-decoration:line-through}
.blk.done{opacity:.7}
.blk.dragging{opacity:.4}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:1;pointer-events:none}
.nowline::before{content:"";position:absolute;left:-4px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--bad)}

/* Month */
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month .wd{text-align:center;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;padding:4px 0}
.mday{min-height:104px;border:1px solid var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:4px;background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
.mday:hover{border-color:var(--primary)}
.mday.out{opacity:.45} .mday.today .dn{background:var(--primary);color:var(--primary-ink)}
.mday .dn{font-weight:800;font-size:13px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.mchip{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 70%,var(--text));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mmore{font-size:11px;font-weight:800;color:var(--muted)}

/* Notifications */
.notif{display:flex;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:var(--text)}
.notif.unread{border-left:6px solid var(--primary)}
.notif .t{font-weight:800} .notif .ch{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}

/* People rows */
.person{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.person .info{flex:1;min-width:160px} .person .info .n{font-weight:800}
.conf{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.conf .n{flex:1;font-weight:700}
.kv{display:flex;flex-direction:column;gap:10px}
.kv .r{display:flex;gap:12px;align-items:flex-start}
.kv .r .i{width:28px;text-align:center;font-size:18px;flex:none}
.kv .r .v{flex:1;min-width:0;font-weight:600} .kv .r .v b{font-weight:800}
.msg{border-left:4px solid var(--primary);background:var(--primary-soft);padding:12px 14px;border-radius:0 12px 12px 0;font-size:15px;font-weight:600}
.hist{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-left:2px solid var(--line);padding-left:10px;font-weight:600}
.files{display:flex;flex-wrap:wrap;gap:8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top} th{color:var(--muted);font-weight:800}
.table-wrap{overflow-x:auto}

/* Panel (side on desktop, sheet on phone) */
.overlay{position:fixed;inset:0;background:rgba(14,17,28,.45);display:none;z-index:20}
.overlay.open{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);box-shadow:var(--shadow);overflow:auto;padding:20px 20px 28px;display:flex;flex-direction:column;gap:16px;transform:translateX(16px);opacity:0;transition:transform .2s, opacity .2s}
.overlay.open .panel{transform:none;opacity:1}
.panel .ptop{display:flex;align-items:flex-start;gap:12px}
.panel .ptop .x{margin-left:auto;flex:none}
.panel .stripe{height:6px;border-radius:999px;background:var(--c,var(--line));margin:-4px 0 0}
@media (max-width:820px){
  .panel{top:auto;left:0;right:0;width:100%;max-height:92vh;border-radius:20px 20px 0 0;transform:translateY(24px);padding-bottom:calc(24px + env(safe-area-inset-bottom))}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:800;font-size:15px;z-index:30;box-shadow:var(--shadow);max-width:min(92vw,520px);text-align:center;opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:10px;align-items:center;justify-content:center}
.toast.show{opacity:1}
.toast.ok::before{content:"✓";display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ok);color:#fff;font-size:14px;flex:none}
@media (min-width:821px){.toast{bottom:28px}}
.spin{width:18px;height:18px;border:3px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="offline" id="offline">Sin conexión. Puedes ver la agenda; los cambios se guardarán cuando vuelva la conexión.</div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="topbar">
      <div class="title"><h1 id="viewTitle">Inicio</h1></div>
      <button class="btn primary sm" id="topCrear" data-act="crear">+ Crear actividad</button>
      <button class="userchip" id="userChip" data-act="editar-persona-yo" aria-label="Mi perfil"></button>
      <button class="bell" data-act="go" data-view="avisos" aria-label="Avisos">🔔 <span class="lbl">Avisos</span><span class="dot" id="bellDot" hidden>0</span></button>
    </header>
    <main class="content" id="content"><div class="empty"><span class="spin"></span>Cargando tu agenda…</div></main>
  </div>
</div>
<button class="btn primary fab" data-act="crear">+ Crear</button>
<nav class="tabbar" id="tabbar"></nav>
<div class="overlay" id="overlay"><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="/app.js"></script>
</body>
</html>
